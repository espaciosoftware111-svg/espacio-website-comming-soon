    <!-- Tailwind CSS Play CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              luxury: {
                beige: '#F7F4EE',
                'beige-light': '#FAF8F5',
                'beige-dark': '#EFE9DF',
                'beige-border': '#E4DCD0',
                charcoal: '#121316',
                'charcoal-light': '#1E2024',
                'charcoal-muted': '#4A4D55',
                gold: '#C5A572',
                'gold-light': '#DFC28D',
                'gold-dark': '#9A7A48',
                'gold-subtle': '#E8D5B5',
                obsidian: '#070809',
                'obsidian-card': '#0E1013',
                'obsidian-border': '#1F2228',
                silver: '#E5E7EB',
                'silver-bright': '#F9FAFB',
              }
            },
            fontFamily: {
              serif: ['Cinzel', 'Playfair Display', 'Georgia', 'serif'],
              editorial: ['"Cormorant Garamond"', 'Playfair Display', 'serif'],
              sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
            },
            boxShadow: {
              'luxury': '0 20px 40px -15px rgba(18, 19, 22, 0.07), 0 0 1px 1px rgba(18, 19, 22, 0.05)',
              'luxury-hover': '0 30px 60px -20px rgba(18, 19, 22, 0.12), 0 0 1px 1px rgba(18, 19, 22, 0.08)',
              'plaque': '0 35px 70px -15px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.1) inset',
              'gold-glow': '0 0 25px rgba(197, 165, 114, 0.3)',
            }

    <style>
      body {
        background-color: #F7F4EE;
        color: #121316;
        margin: 0;
        padding: 0;
        font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      }
      *, *::before, *::after {
        box-sizing: border-box;
      }
      html, body, #root {
        width: 100%;
        max-width: 100vw;
        overflow-x: hidden !important;
        margin: 0;
        padding: 0;
      }
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #EFE9DF;
      }
      ::-webkit-scrollbar-thumb {
        background: #C5A572;
        border-radius: 4px;
      }
      @keyframes marqueeScroll {
        0% { transform: translateX(0); }
        100% { transform: translateX(-50%); }
      }
      .animate-marquee-right-to-left {
        display: flex;
        width: max-content;
        animation: marqueeScroll 22s linear infinite;
      }
      @keyframes lampSwing {
        0% { transform: rotate(-3.6deg); }
        50% { transform: rotate(3.6deg); }
        100% { transform: rotate(-3.6deg); }
      }
      .animate-lamp-swing {
        transform-origin: 50% 0%;
        animation: lampSwing 2.6s ease-in-out infinite;
      }
    </style>
  </head>
  <body class="w-full max-w-[100vw] overflow-x-hidden m-0 p-0">
    <div id="root"></div>

    <!-- Standalone browser script runs immediately in any browser -->
    <script src="./src/standalone-app.js"></script>

    <!-- Vite module entry point (active when served via Vite dev server) -->
    <script type="module" src="./src/main.tsx"></script>
  </body>
